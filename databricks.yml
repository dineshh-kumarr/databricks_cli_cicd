# This is a Declarative Automation Bundle definition for databricks_cli_cicd.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_cli_cicd
  uuid: 24a267c8-4f9b-4fbc-98ca-75b1a0484db3

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-33079b27-cce0.cloud.databricks.com
    variables:
      catalog: dev
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-33079b27-cce0.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/raazsingh501@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/raazsingh501@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dev
      schema: prod
    permissions:
      - user_name: raazsingh501@gmail.com
        level: CAN_MANAGE
